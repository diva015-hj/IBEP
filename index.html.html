<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>나의 학습자상 찾기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap">
<style>
/* Layout: one-screen mobile card game — scene card on top, two stacked choice buttons with a VS hinge, single light look by choice (booth use) */
:root{
  --ink:#1d2340;          /* 칠판 같은 짙은 남색 */
  --paper:#f3f5fb;        /* 차가운 흰 종이 */
  --card:#ffffff;
  --muted:#626a8c;
  --line:#d9ddeb;
  --a:#1f8a7a;            /* 선택 A: 청록 */
  --a-soft:#d7f0eb;
  --b:#e2573f;            /* 선택 B: 다홍 */
  --b-soft:#fbe0da;
  --sun:#f5b82e;          /* 강조: 해바라기 */
  --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --latin:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
.app{min-height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 20px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.screen{display:flex;flex-direction:column;gap:16px;flex:1}

/* ---------- 시작 ---------- */
.intro{justify-content:center;gap:22px;text-align:left}
.badge{align-self:flex-start;font-family:var(--latin);font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:6px 10px;border-radius:4px}
.intro h1{font-size:clamp(44px,13vw,60px);line-height:1.02;letter-spacing:-.01em}
.intro h1 .or{display:inline-block;color:var(--paper);background:var(--b);padding:0 .18em;border-radius:6px;transform:rotate(-3deg);margin:0 .06em}
.intro h1 .t{color:var(--a)}
.intro p{margin:0;color:var(--muted);font-size:17px;max-width:34ch}
.chips10{display:flex;flex-wrap:wrap;gap:6px}
.chips10 span{font-size:13px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.howto div{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px;font-size:13px;color:var(--muted)}
.howto b{display:block;font-family:var(--display);font-weight:400;font-size:22px;color:var(--ink)}
.cta{border:0;background:var(--ink);color:var(--paper);font-family:var(--display);font-size:24px;padding:16px;border-radius:14px;box-shadow:0 5px 0 var(--sun);transition:transform .1s}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sun)}

/* ---------- 문항 ---------- */
.top{display:flex;align-items:center;gap:12px}
.count{font-family:var(--latin);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.count small{color:var(--muted);font-weight:700}
.bar{flex:1;display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.bar i{height:6px;border-radius:3px;background:var(--line)}
.bar i.done{background:var(--ink)}
.bar i.now{background:var(--sun)}
.home{border:0;background:none;color:var(--muted);font-size:13px;padding:4px}

.scene{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:20px;overflow:hidden;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center}
.scene img{width:100%;height:100%;object-fit:cover;display:block}
.scene .tag{position:absolute;left:12px;top:12px;background:var(--ink);color:var(--paper);font-size:13px;padding:3px 10px;border-radius:999px}
.scene .e{position:absolute;line-height:1;filter:drop-shadow(0 4px 0 rgba(29,35,64,.12))}
.scene .e.m{font-size:clamp(72px,24vw,104px);animation:bob 3s ease-in-out infinite}
.scene .e.l{font-size:clamp(40px,12vw,54px);left:13%;bottom:16%;animation:bob 3.4s ease-in-out .3s infinite}
.scene .e.r{font-size:clamp(40px,12vw,54px);right:13%;top:20%;animation:bob 3.2s ease-in-out .6s infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.situation{font-size:19px;line-height:1.5;margin:0;font-family:var(--body);font-weight:700}
.situation em{font-style:normal;display:block;font-family:var(--display);font-size:24px;margin-top:4px}

.choices{display:flex;flex-direction:column;gap:0;margin-top:auto;position:relative}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--ink);border-radius:16px;padding:14px 16px;min-height:76px;transition:transform .12s,box-shadow .12s}
.opt .k{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--latin);font-weight:800;font-size:16px;color:#fff}
.opt .tx{font-size:17px;font-weight:700;line-height:1.4;min-width:0}
.opt.a{background:var(--a-soft);box-shadow:0 5px 0 var(--a)}
.opt.a .k{background:var(--a)}
.opt.b{background:var(--b-soft);box-shadow:0 5px 0 var(--b)}
.opt.b .k{background:var(--b)}
.opt:active{transform:translateY(3px)}
.opt.a:active{box-shadow:0 2px 0 var(--a)}
.opt.b:active{box-shadow:0 2px 0 var(--b)}
.opt.picked{transform:scale(1.02)}
.opt.faded{opacity:.35}
.vs{align-self:center;font-family:var(--latin);font-weight:800;font-size:14px;letter-spacing:.08em;background:var(--sun);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:2px 12px;margin:-4px 0;position:relative;z-index:2}
.choices .opt.b{margin-top:-4px}

/* ---------- 결과 ---------- */
.result{gap:18px}
.r-eyebrow{font-size:14px;color:var(--muted);margin:0}
.hero{background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.hero .icon{font-size:64px;line-height:1}
.hero h2{font-size:clamp(34px,10vw,44px);line-height:1.08}
.hero .en{font-family:var(--latin);font-weight:800;font-size:22px;letter-spacing:.01em;color:var(--b);margin-top:-4px}
.hero p{margin:0;font-size:16px}
.hero .stamp{position:absolute;right:-14px;top:18px;transform:rotate(12deg);font-family:var(--latin);font-weight:800;font-size:11px;letter-spacing:.14em;border:2px solid var(--a);color:var(--a);padding:4px 14px;border-radius:4px;text-transform:uppercase}
.sec h3{font-size:21px;margin-bottom:8px}
.ranks{display:flex;flex-direction:column;gap:8px}
.rank{display:grid;grid-template-columns:118px 1fr 34px;align-items:center;gap:10px;font-size:14px}
.rank .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .tr{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.rank .fl{height:100%;background:var(--ink);border-radius:6px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.rank:first-child .fl{background:var(--sun)}
.rank .pc{font-family:var(--latin);font-weight:700;font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
.values{display:flex;flex-wrap:wrap;gap:6px}
.values span{font-size:14px;padding:5px 11px;border-radius:999px;border:1.5px solid var(--ink);background:var(--card)}
.values span b{font-family:var(--latin);font-size:12px;margin-left:4px;color:var(--b)}
.ask{background:var(--ink);color:var(--paper);border-radius:16px;padding:16px 18px}
.ask small{display:block;font-size:12px;letter-spacing:.12em;color:var(--sun);font-family:var(--latin);font-weight:800;text-transform:uppercase;margin-bottom:4px}
.ask p{margin:0;font-size:17px}
.log{display:flex;flex-direction:column;gap:6px;font-size:14px}
.log div{display:flex;gap:8px;align-items:baseline;border-bottom:1px dashed var(--line);padding-bottom:6px}
.log .n{font-family:var(--latin);font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;width:20px;flex:none}
.log .c{min-width:0;flex:1}
.log .v{flex:none;font-size:12px;padding:1px 8px;border-radius:999px;color:#fff}
.log .v.a{background:var(--a)} .log .v.b{background:var(--b)}
.again{display:grid;grid-template-columns:1fr;gap:10px}
.ghost{border:2px solid var(--ink);background:transparent;border-radius:14px;padding:12px;font-family:var(--display);font-size:20px}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:0}

.enter{animation:enter .35s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:.0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app"></div>

<script>
/* ===== 10가지 IB 학습자상 ===== */
const P = {
  inq:{ko:"탐구하는 사람",en:"Inquirers",icon:"🔍",desc:"궁금한 것을 그냥 넘기지 않아요. 스스로 질문을 만들고, 답을 찾아가는 과정 자체를 즐기는 사람이에요.",ask:"요즘 가장 궁금한 질문 하나는 무엇인가요? 그 답을 어떻게 찾아볼 수 있을까요?"},
  know:{ko:"지식을 갖춘 사람",en:"Knowledgeable",icon:"📚",desc:"제대로 알고 행동하고 싶어 해요. 여러 분야를 깊이 이해하고, 배운 것을 실제 상황에 연결하는 사람이에요.",ask:"최근에 배운 것 중 학교 밖에서 써먹은 지식이 있나요?"},
  think:{ko:"생각하는 사람",en:"Thinkers",icon:"🧠",desc:"한 번 더 따져 보고 결정해요. 근거를 살피고 비판적·창의적으로 생각해서 합리적인 선택을 하는 사람이에요.",ask:"다른 사람 말을 그대로 믿지 않고 직접 확인해 본 경험이 있나요?"},
  comm:{ko:"소통하는 사람",en:"Communicators",icon:"💬",desc:"생각을 자신 있게 말하고, 다른 사람의 말도 잘 들어요. 함께 이야기하며 더 나은 답을 만드는 사람이에요.",ask:"내 생각을 말하는 것과 다른 사람 말을 듣는 것 중 무엇이 더 어려운가요?"},
  prin:{ko:"원칙을 지키는 사람",en:"Principled",icon:"⚖️",desc:"손해를 보더라도 정직하고 공정하게 행동하려 해요. 자신의 선택과 그 결과에 책임지는 사람이에요.",ask:"‘이건 지켜야 한다’고 생각하는 나만의 원칙은 무엇인가요?"},
  open:{ko:"열린 마음을 지닌 사람",en:"Open-minded",icon:"🌏",desc:"나와 다른 생각, 다른 문화를 흥미롭게 받아들여요. 여러 관점을 살펴보며 자신의 생각을 넓혀 가는 사람이에요.",ask:"처음엔 낯설었지만 알고 나니 좋아진 것이 있나요?"},
  care:{ko:"배려하는 사람",en:"Caring",icon:"🤝",desc:"다른 사람의 마음을 먼저 살펴요. 공감하고 존중하며, 주변을 더 좋게 만들기 위해 행동하는 사람이에요.",ask:"누군가를 도우면서 나도 기뻤던 순간은 언제였나요?"},
  risk:{ko:"도전하는 사람",en:"Risk-takers",icon:"🚀",desc:"결과가 불확실해도 용기 있게 해 봐요. 새로운 시도에서 실패해도 거기서 배우는 사람이에요.",ask:"해 보고 싶지만 아직 망설이고 있는 도전은 무엇인가요?"},
  bal:{ko:"균형 잡힌 사람",en:"Balanced",icon:"🧘",desc:"공부, 쉼, 관계 사이에서 균형을 찾아요. 몸과 마음을 함께 돌보며 나와 다른 사람의 행복을 챙기는 사람이에요.",ask:"나를 다시 힘나게 하는 나만의 충전 방법은 무엇인가요?"},
  refl:{ko:"성찰하는 사람",en:"Reflective",icon:"🪞",desc:"지나간 일을 돌아보며 배워요. 자신의 강점과 약점을 이해하고, 다음에 더 나아지는 방법을 찾는 사람이에요.",ask:"최근에 한 실수에서 배운 점은 무엇인가요?"}
};
const ORDER=["inq","know","think","comm","prin","open","care","risk","bal","refl"];

/* ===== 딜레마 12문항 =====
   각 선택지: p=주 가치(2점), s=부 가치(1점), v=선택에 깔린 가치 낱말
   scene.img 에 사진 주소(또는 data URI)를 넣으면 이모지 대신 사진이 나와요. */
const Q = [
 {s:{tag:"모둠 과제",bg:"#e6ecff",e:["📄","😰","⏰"]},t:"내일이 모둠 발표인데, 친구가 맡은 부분을 하나도 안 해왔다.",
  A:{t:"오늘 밤 내가 대신 채워서 완성한다",p:"care",s:"bal",v:"책임감"},
  B:{t:"선생님께 상황을 솔직하게 말씀드린다",p:"prin",s:"comm",v:"정직"}},
 {s:{tag:"시험 전날 밤",bg:"#e9e4ff",e:["📱","🌙","📝"]},t:"시험 전날 밤, 친한 친구가 울먹이며 전화를 걸어왔다.",
  A:{t:"시간이 걸려도 끝까지 들어준다",p:"care",s:"comm",v:"공감"},
  B:{t:"“내일 시험 끝나고 꼭 얘기하자” 하고 공부한다",p:"bal",s:"prin",v:"자기 관리"}},
 {s:{tag:"동아리 신청",bg:"#fff1cc",e:["🎨","🤔","🎸"]},t:"동아리 신청 마감이 오늘이다. 딱 하나만 고를 수 있다.",
  A:{t:"이미 잘하는 분야 동아리",p:"know",s:"bal",v:"전문성"},
  B:{t:"한 번도 안 해본 분야 동아리",p:"risk",s:"inq",v:"용기"}},
 {s:{tag:"수업 시간",bg:"#dff3ee",e:["✋","❓","🧑‍🏫"]},t:"수업 중에 진도와는 상관없는 궁금증이 생겼다.",
  A:{t:"손 들고 바로 질문한다",p:"comm",s:"risk",v:"표현"},
  B:{t:"집에 가서 직접 찾아본다",p:"inq",s:"know",v:"호기심"}},
 {s:{tag:"시험지 받는 날",bg:"#ffe6e0",e:["💯","😊","✏️"]},t:"생각보다 점수가 잘 나온 시험지를 돌려받았다.",
  A:{t:"틀린 문제를 다시 분석해 본다",p:"refl",s:"think",v:"되돌아봄"},
  B:{t:"다음 단원을 미리 공부한다",p:"know",s:"inq",v:"배움"}},
 {s:{tag:"학급 회의",bg:"#e6ecff",e:["🙋","🗳️","🙋‍♀️"]},t:"학급 회의에서 내 의견과 다수의 의견이 다르다.",
  A:{t:"근거를 정리해서 끝까지 설득해 본다",p:"think",s:"comm",v:"논리"},
  B:{t:"다수가 왜 그렇게 생각하는지 먼저 들어본다",p:"open",s:"refl",v:"존중"}},
 {s:{tag:"점심시간",bg:"#fff1cc",e:["🍱","🧑‍🎓","💭"]},t:"전학 온 친구가 낯선 음식을 먹고 있는데, 몇몇이 뒤에서 수군거린다.",
  A:{t:"친구 옆에 앉아 무슨 음식인지 물어본다",p:"open",s:"care",v:"포용"},
  B:{t:"수군대는 친구들에게 그만하라고 말한다",p:"prin",s:"risk",v:"정의"}},
 {s:{tag:"주말 아침",bg:"#dff3ee",e:["🛋️","☀️","🎟️"]},t:"모처럼 아무 일정 없는 토요일이다.",
  A:{t:"아무 계획 없이 푹 쉬며 충전한다",p:"bal",s:"refl",v:"쉼"},
  B:{t:"평소 궁금했던 전시나 체험에 간다",p:"inq",s:"open",v:"탐색"}},
 {s:{tag:"단톡방",bg:"#e9e4ff",e:["📰","‼️","💬"]},t:"반 단톡방에 출처가 불분명한 충격적인 기사가 올라왔다.",
  A:{t:"믿기 전에 다른 기사와 출처부터 찾아본다",p:"think",s:"inq",v:"비판적 사고"},
  B:{t:"“확인 안 된 정보 같아”라고 단톡방에 말한다",p:"comm",s:"prin",v:"신뢰"}},
 {s:{tag:"모둠 역할",bg:"#ffe6e0",e:["🎤","👥","📊"]},t:"모둠 발표 역할을 나누는 중이다. 아무도 발표를 하겠다고 하지 않는다.",
  A:{t:"떨리지만 내가 발표하겠다고 손을 든다",p:"risk",s:"comm",v:"도전"},
  B:{t:"자료 조사와 정리를 꼼꼼히 맡는다",p:"know",s:"think",v:"성실"}},
 {s:{tag:"쉬는 시간",bg:"#e6ecff",e:["😅","💔","🙇"]},t:"장난으로 한 말에 친구 표정이 굳었다. 상처받은 것 같다.",
  A:{t:"그 자리에서 바로 사과한다",p:"care",s:"prin",v:"배려"},
  B:{t:"왜 그런 말을 했는지 돌아본 뒤 진심을 담아 사과한다",p:"refl",s:"think",v:"성찰"}},
 {s:{tag:"국제 교류",bg:"#fff1cc",e:["✈️","🌏","🧳"]},t:"다음 달, 처음 가보는 나라의 학교와 교류 활동을 하게 됐다.",
  A:{t:"현지 친구에게 건넬 인사말부터 연습한다",p:"comm",s:"open",v:"연결"},
  B:{t:"준비는 최소로, 가서 부딪히며 배운다",p:"risk",s:"open",v:"모험"}}
];

/* 프로필별 최대 가능 점수로 나눠서 등장 횟수 차이를 보정 */
const MAX={}; ORDER.forEach(k=>MAX[k]=0);
Q.forEach(q=>ORDER.forEach(k=>{
  const pt=o=>(o.p===k?2:0)+(o.s===k?1:0);
  MAX[k]+=Math.max(pt(q.A),pt(q.B));
}));

let picks=[], idx=0, locked=false;
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function intro(){
  picks=[];idx=0;
  app.innerHTML=`<section class="screen intro enter">
    <span class="badge">IB Learner Profile</span>
    <h1><span class="t">이거</span><span class="or">vs</span>저거</h1>
    <p>학교와 일상에서 만나는 12가지 딜레마. 정답은 없어요. 내 마음이 끌리는 쪽을 고르면, 나와 가장 닮은 학습자상을 알려드려요.</p>
    <div class="howto">
      <div><b>12</b>개의 상황</div>
      <div><b>2</b>개의 선택</div>
      <div><b>1</b>개의 학습자상</div>
    </div>
    <div class="chips10">${ORDER.map(k=>`<span>${P[k].ko}</span>`).join("")}</div>
    <button class="cta" id="go">시작하기</button>
  </section>`;
  document.getElementById("go").onclick=()=>question();
}

function sceneHTML(s){
  if(s.img) return `<div class="scene"><img src="${esc(s.img)}" alt="${esc(s.tag)} 상황"><span class="tag">${esc(s.tag)}</span></div>`;
  return `<div class="scene" style="background:${s.bg}" role="img" aria-label="${esc(s.tag)} 상황 그림">
    <span class="tag">${esc(s.tag)}</span>
    <span class="e l">${s.e[0]}</span><span class="e m">${s.e[1]}</span><span class="e r">${s.e[2]}</span></div>`;
}

function question(){
  locked=false;
  const q=Q[idx];
  const bar=Q.map((_,i)=>`<i class="${i<idx?"done":i===idx?"now":""}"></i>`).join("");
  app.innerHTML=`<section class="screen enter">
    <div class="top"><span class="count">${String(idx+1).padStart(2,"0")}<small> / ${Q.length}</small></span><div class="bar">${bar}</div><button class="home" id="home">처음으로</button></div>
    ${sceneHTML(q.s)}
    <p class="situation">${esc(q.t)}<em>나라면?</em></p>
    <div class="choices">
      <button class="opt a" data-k="A"><span class="k">A</span><span class="tx">${esc(q.A.t)}</span></button>
      <span class="vs">VS</span>
      <button class="opt b" data-k="B"><span class="k">B</span><span class="tx">${esc(q.B.t)}</span></button>
    </div>
  </section>`;
  document.getElementById("home").onclick=intro;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(b));
}

function choose(btn){
  if(locked) return; locked=true;
  const k=btn.dataset.k;
  picks[idx]=k;
  app.querySelectorAll(".opt").forEach(b=>b.classList.add(b===btn?"picked":"faded"));
  setTimeout(()=>{ idx++; idx<Q.length?question():result(); },320);
}

function result(){
  const sc={},prim={}; ORDER.forEach(k=>{sc[k]=0;prim[k]=0});
  const vals={};
  picks.forEach((k,i)=>{
    const o=Q[i][k];
    sc[o.p]+=2; sc[o.s]+=1; prim[o.p]++;
    vals[o.v]=(vals[o.v]||0)+1;
  });
  const ranked=ORDER.map(k=>({k,r:MAX[k]?sc[k]/MAX[k]:0,p:prim[k]}))
    .sort((a,b)=>b.r-a.r||b.p-a.p);
  const top=P[ranked[0].k];
  const top5=ranked.slice(0,5);
  const valList=Object.entries(vals).sort((a,b)=>b[1]-a[1]);

  app.innerHTML=`<section class="screen result enter">
    <p class="r-eyebrow">12번의 선택으로 본 나와 가장 닮은 학습자상은</p>
    <div class="hero">
      <span class="stamp">My Profile</span>
      <span class="icon">${top.icon}</span>
      <h2>${top.ko}</h2>
      <span class="en">${top.en}</span>
      <p>${top.desc}</p>
    </div>
    <div class="sec"><h3>내 선택 속 학습자상</h3>
      <div class="ranks">${top5.map(x=>`<div class="rank"><span class="nm">${P[x.k].ko}</span><span class="tr"><span class="fl" style="width:0" data-w="${Math.round(x.r*100)}"></span></span><span class="pc">${Math.round(x.r*100)}</span></div>`).join("")}</div>
    </div>
    <div class="sec"><h3>내가 고른 가치</h3>
      <div class="values">${valList.map(([v,n])=>`<span>${esc(v)}${n>1?`<b>×${n}</b>`:""}</span>`).join("")}</div>
    </div>
    <div class="ask"><small>Think about it</small><p>${top.ask}</p></div>
    <div class="sec"><h3>나의 선택 기록</h3>
      <div class="log">${picks.map((k,i)=>`<div><span class="n">${String(i+1).padStart(2,"0")}</span><span class="c">${esc(Q[i][k].t)}</span><span class="v ${k.toLowerCase()}">${esc(Q[i][k].v)}</span></div>`).join("")}</div>
    </div>
    <p class="hint">화면을 캡처해서 부스 선생님께 보여주세요</p>
    <div class="again"><button class="cta" id="next">다음 친구에게 넘기기</button></div>
  </section>`;
  window.scrollTo(0,0);
  requestAnimationFrame(()=>requestAnimationFrame(()=>app.querySelectorAll(".fl").forEach(f=>f.style.width=f.dataset.w+"%")));
  document.getElementById("next").onclick=()=>{window.scrollTo(0,0);intro()};
}

intro();
</script>

</body></html>
